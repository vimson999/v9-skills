id: jianting-research
revision: 2
kind: directing
name: 兼听研报
purpose: 同一标的多家机构观点对比，让观众理解共识、分歧及其依据。
defaults:
  audience: 希望读懂研报、比较机构观点的普通财经观众
  reading_load: 一镜一个主要比较问题；图表复杂时拆镜或延长阅读时间
  text: 关键数字、机构名、口径与来源后期准确排版，原始插画默认无字
rules:
  - 沿口播识别问题、事实证据、机构共识、机构分歧及后续观察点；按实际出现的内容安排，不强求五段齐全。
  - 对比镜头使用相同指标、单位和时间范围；不可比的数据标明口径差异，不强行画在同一比例尺上。
  - 每个观点保留机构归属，区分报告事实、机构预测与作者判断；不以某家图标代表全部机构。
  - 数字图表使用 external_design，designBrief 写明源数据、单位、期间、机构、实际或预测及来源定位；缺数据则列待办，不编造柱高或曲线。
  - 同一机构在本项目中的位置和视觉标识保持一致；用文字或形状辅助区分，不仅靠红绿颜色。
  - 概念插画表达现金流、投入、竞争等关系；不把虚构工厂、人物或报告页伪装成真实证据。
  - 并列观点不等于强行制造评级分歧；不要把估值目标画成必然上涨，不加入口播中没有的推荐结论。
variants:
  high_background_podcast:
    activation: 仅当用户本次或已确认项目配置明确请求 high_background_podcast 时启用；泛称财经、选择 jianting-research 或 image-only 均不自动启用。
    background_video:
      coverage_starting_target: 0.90
      coverage_definition: 以构图总帧中含有效背景视频层的帧占比计算；这是覆盖率，不是独立源素材时长，也不等于感知可见度。
      holdouts: 纯数据或证据画面在可读性或来源忠实度需要时可以保留，不强制铺设背景视频。
    reporting:
      background_coverage: 单独报告有效背景视频层覆盖的构图帧占比。
      unique_usable_footage: 单独报告独立可用素材时长；它是诊断指标，不是制作门槛。
      reused_assets_and_treatments: 单独记录复用的素材及每次采用的处理方式。
    reuse:
      policy: 允许编辑诚实且符合语义的变化复用，不把同一来源包装成多个独立证据。
      treatments:
        - trim: 调整素材入点、出点或选用片段。
        - crop: 根据构图与主体重新裁切。
        - scale: 按层级和画幅调整缩放。
        - speed: 在不歪曲事实或动作含义时调整速度。
        - opacity: 按画面层级调整素材透明度。
        - layout: 改变图层位置、分栏或前后景关系。
        - spacing: 调整留白以及素材与信息层的间距。
    compositing_controls:
      asset_opacity:
        policy: 背景素材层透明度独立可调，按项目与镜头判断，不设通用固定数值区间。
      overlay_alpha:
        policy: 覆盖层透明度独立可调，按项目与镜头判断，不设通用固定数值区间。
visual_patterns:
  - 预期差：同口径实际值与预期值并列，解释差值来源。
  - 机构比较：固定位置逐项显示观点；竖屏优先纵向卡片，复杂表格拆成多个独立画面。
  - 因果说明：少量物件与连接关系说明文案逻辑，推测和关联使用相应标签，不能画成确定因果。
  - 观察清单：以原文明确提出的跟踪变量收束，避免另造投资建议。
asset_search:
  - 检索具体企业、机构时交由素材能力核对身份和来源；通用商业插画须明确示意用途。
  - 将可跨项目复用的概念插画与本项目数字、机构标签分离。
