id: health-explainer
revision: 1
kind: directing
name: 中老年健康科普
purpose: 用日常场景、具体物件与可看清的动作解释口播，方便中老年观众理解。
defaults:
  audience: 50岁以上中老年观众
  reading_load: 每镜一个主要动作或知识点，读图时间以文字负担和动作复杂度决定
  text: 高对比、大字、少字；关键词后期叠加，原始插画默认无字
rules:
  - 按原稿识别生活困扰、原理、做法和提醒；沿口播顺序安排，不补写疗效和新建议。
  - 优先用生活人物、食材和环境关系表达；避免全片都是泛化老人微笑、器官图或装饰风景。
  - 动作镜头说明支撑点、姿态、关键部位及拍摄视角，尽量完整呈现关键关节；动作阶段不同可拆成独立图片。
  - 连续动作保持人物、衣着与环境一致；构图让观众看清正在变化的部位，不用快速推拉遮挡动作。
  - 图中文字与字幕分工，保留关键词而非把整段口播再写一遍；用户要求图文成图时列逐字文案并安排文字核查。
  - 示意图只解释原稿含义，不把食物画成药物替代、不将相关性变因果、不用身体前后对比暗示未经支持的逆转或治愈。
  - 发现原稿含未经支持的疗效或精确剂量时记录待核验内容，先用中性场景表达，不通过画面增强该结论。
  - 人物自然有尊严，避免把中老年形象统一画成衰弱病人或幼儿化卡通；具体人物设定由项目决定。
visual_patterns:
  - 日常情境：厨房、餐桌、散步等与本段内容相关的具体行为。
  - 动作说明：主体占主要面积，以侧面或局部特写呈现关键部位；先看懂一个动作再切换。
  - 物件比较：少量食物或用品对应原文差异，不用暗示确定疗效的虚构数据图。
  - 原理示意：只画理解所需的少量结构，确需准确解剖或数据时交给专业素材或确定性设计。
asset_search:
  - 按年龄形象、行为、关键部位可见性、构图、风格检索；不能因人物年龄相似就判定动作素材适用。
  - 日常人物和食材图可跨项目复用，项目文字和讲解步骤单独记录。
