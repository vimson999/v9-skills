id: warm-life-illustration
revision: 1
kind: visual-style
name: 温暖生活插画
status: starter
description: >-
  温暖、自然的生活手绘插画，米白纸感底色，柔和但清楚的深棕灰轮廓，
  鼠尾草绿、浅陶土色与淡蓝作为少量配色，色块平涂辅以轻微铅笔纹理。
  人物接近自然比例，表情温和而不过度夸张，手脚结构清楚；
  以日常动作和具体物件为视觉中心，背景简化，避免过度光滑的皮肤与塑料质感。
palette:
  background: "#FAF4E8"
  outline: "#514A42"
  primary: "#8C9D83"
  accent: "#C68F76"
  secondary: "#A6BDC9"
composition:
  - 让一个主要动作或物件关系占据画面中心，关键手脚部位与主体轮廓完整可见。
  - 以明暗对比保持辨识度，浅色仅用于背景和填色，不用浅色小字承载关键信息。
characters: 年龄、外貌、衣着跟随项目受众和内容；不因选择此画风就自动生成老人。
text_policy: 默认原图无字，关键词后期以深色大字排版；图内文字只按项目逐字清单生成。
subtitle_safe_area: 默认下方约20%低细节留白；动作涉及脚部时上移主体或重排字幕，不能遮住动作。
motion: 以静止和缓慢小幅推近为主；先确保动作看清，再决定是否运动。
avoid:
  - 夸大头身比、幼儿化人物、过曝磨皮与高饱和荧光色
  - 无关装饰、整段口播文字堆满画面
  - 把多个分镜拼成九宫格作为最终素材
