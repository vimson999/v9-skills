id: editorial-minimal
revision: 1
kind: visual-style
name: 极简编辑插画
status: starter
description: >-
  扁平编辑插画，暖白背景，深石墨灰的清晰轮廓与少量几何色块；
  石板蓝作为主要强调色，低饱和赭色用于局部对比。
  主体简洁、比例自然，轻微纸张颗粒，阴影克制，无厚重三维塑料质感。
  围绕一个主要关系构图，背景仅保留识别场景所需的物件，留出字幕与后期标签空间。
palette:
  background: "#F7F5EF"
  outline: "#30363B"
  primary: "#526F86"
  accent: "#B27A4B"
composition:
  - 根据项目画幅重排主体，不把横版复杂布局直接裁成竖版。
  - 标签和准确数字由后期排版；比较对象在同一镜中使用相近视觉权重。
characters: 需要人物时使用自然成人比例、简化面部与服装细节；连续人物另设稳定特征。
text_policy: 默认原图无文字、数字和伪标识；按项目明确文字要求覆盖。
subtitle_safe_area: 默认下方约20%保留低细节区域；按实际字幕布局调整，不让关键部位落入该区域。
motion: 静止或轻微平移推近，以不裁掉主体、标签及比较对象为限。
avoid:
  - 泛滥的金币、火箭、发光箭头与无意义金融符号
  - 把多个分镜拼成九宫格作为最终素材
  - 未提供真实参考却声称复刻某频道画风
